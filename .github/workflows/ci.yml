name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Compile + Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Maven verify (compile + tests + shade package)
        working-directory: worker
        run: mvn -B -ntp verify

      - name: Verify gRPC ServiceLoader merged in shaded JAR
        working-directory: worker
        run: |
          jar=$(ls target/crawl-news-worker-*.jar | head -n1)
          echo "Inspecting: $jar"
          unzip -p "$jar" META-INF/services/io.grpc.LoadBalancerProvider | tee /tmp/lb.txt
          grep -q "RoundRobinLoadBalancerProvider" /tmp/lb.txt

      - name: Upload worker jar
        uses: actions/upload-artifact@v4
        with:
          name: crawl-news-worker-jar
          path: worker/target/crawl-news-worker-*.jar
          if-no-files-found: error
          retention-days: 7

      - name: Upload JaCoCo coverage report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: worker/target/site/jacoco
          if-no-files-found: warn
          retention-days: 7

      - name: Upload surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: worker/target/surefire-reports
          if-no-files-found: ignore
          retention-days: 7

  compose-validate:
    name: Validate docker-compose
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Seed .env for compose interpolation
        run: cp .env.example .env
      - name: docker compose config
        run: docker compose config -q

  smoke:
    name: Smoke (NewsDemoWorkflow on real stack)
    needs: [build-test, compose-validate]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Seed .env for compose interpolation
        run: cp .env.example .env

      - name: Build and start stack
        run: docker compose up --build -d

      - name: Wait for Temporal frontend
        run: |
          for i in $(seq 1 60); do
            if docker compose exec -T temporal-admin-tools \
                temporal --address temporal:7233 operator cluster health >/dev/null 2>&1; then
              echo "temporal is up"
              exit 0
            fi
            sleep 2
          done
          echo "Temporal did not become ready in time" >&2
          docker compose logs temporal --tail 200 || true
          exit 1

      - name: Wait for crawl-worker to start polling Temporal
        # The worker prints "Polling Temporal ..." after factory.start() succeeds (WorkerMain.java),
        # which is the definitive signal it has registered pollers on news-task-queue. We match on
        # logs from any replica (deploy.replicas: 3).
        run: |
          for i in $(seq 1 90); do
            if docker compose logs crawl-worker 2>&1 | grep -q 'Polling Temporal'; then
              echo "crawl-worker is polling"
              exit 0
            fi
            sleep 2
          done
          echo "No crawl-worker poller after timeout" >&2
          docker compose logs crawl-worker --tail 400 || true
          exit 1

      - name: Execute NewsDemoWorkflow and assert result
        # `workflow execute` starts AND blocks until completion, printing the result. This avoids
        # the race where `workflow show` is polled before the workflow task has even started.
        run: |
          wfid="ci-smoke-$(date +%s)"
          result=$(docker compose exec -T temporal-admin-tools \
            temporal --address temporal:7233 workflow execute \
              --task-queue news-task-queue \
              --type NewsDemoWorkflow \
              --workflow-id "$wfid" \
              --input '"ci"' 2>&1)
          echo "$result"
          echo "$result" | grep -q 'ok:ci' || {
            echo "Smoke workflow did not return expected result" >&2
            docker compose logs crawl-worker --tail 400 || true
            exit 1
          }

      - name: Dump logs on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color --tail 300

      - name: Tear down
        if: always()
        run: docker compose down -v
