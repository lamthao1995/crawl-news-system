name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Compile + Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Maven verify (compile + tests + shade package)
        working-directory: worker
        run: mvn -B -ntp verify

      - name: Verify gRPC ServiceLoader merged in shaded JAR
        working-directory: worker
        run: |
          jar=$(ls target/crawl-news-worker-*.jar | head -n1)
          echo "Inspecting: $jar"
          unzip -p "$jar" META-INF/services/io.grpc.LoadBalancerProvider | tee /tmp/lb.txt
          grep -q "RoundRobinLoadBalancerProvider" /tmp/lb.txt

      - name: Upload worker jar
        uses: actions/upload-artifact@v4
        with:
          name: crawl-news-worker-jar
          path: worker/target/crawl-news-worker-*.jar
          if-no-files-found: error
          retention-days: 7

      - name: Upload JaCoCo coverage report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: worker/target/site/jacoco
          if-no-files-found: warn
          retention-days: 7

      - name: Upload surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: worker/target/surefire-reports
          if-no-files-found: ignore
          retention-days: 7

  compose-validate:
    name: Validate docker-compose
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Seed .env for compose interpolation
        run: cp .env.example .env
      - name: docker compose config
        run: docker compose config -q

  smoke:
    name: Smoke (NewsDemoWorkflow on real stack)
    needs: [build-test, compose-validate]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Seed .env for compose interpolation
        run: cp .env.example .env

      - name: Build and start stack
        run: docker compose up --build -d

      - name: Wait for Temporal frontend
        run: |
          for i in $(seq 1 60); do
            if docker compose exec -T temporal-admin-tools \
                temporal --address temporal:7233 operator cluster health >/dev/null 2>&1; then
              echo "temporal is up"
              exit 0
            fi
            sleep 2
          done
          echo "Temporal did not become ready in time" >&2
          docker compose logs temporal --tail 200 || true
          exit 1

      - name: Wait for at least one crawl-worker poller
        run: |
          for i in $(seq 1 60); do
            out=$(docker compose exec -T temporal-admin-tools \
                    temporal --address temporal:7233 task-queue describe \
                      --task-queue news-task-queue 2>/dev/null || true)
            if echo "$out" | grep -qi 'identity'; then
              echo "$out"
              echo "worker is polling"
              exit 0
            fi
            sleep 2
          done
          echo "No worker polling after timeout" >&2
          docker compose logs crawl-worker --tail 200 || true
          exit 1

      - name: Run NewsDemoWorkflow and assert result
        run: |
          wfid="ci-smoke-$(date +%s)"
          docker compose exec -T temporal-admin-tools \
            temporal --address temporal:7233 workflow start \
              --task-queue news-task-queue \
              --type NewsDemoWorkflow \
              --workflow-id "$wfid" \
              --input '"ci"'
          # Block until the workflow completes, then print result.
          result=$(docker compose exec -T temporal-admin-tools \
            temporal --address temporal:7233 workflow show \
              --workflow-id "$wfid" --output json 2>/dev/null | \
            tr -d '\r')
          echo "$result" | tail -200
          echo "$result" | grep -q '"ok:ci"' || {
            echo "Smoke workflow did not return expected result" >&2
            docker compose logs crawl-worker --tail 200 || true
            exit 1
          }

      - name: Dump logs on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color --tail 300

      - name: Tear down
        if: always()
        run: docker compose down -v
